# Konfigurasi Vhost Nginx CloudPanel (Situs Node.js Tunggal: ruma.alakhyar.sch.id)
# Menggabungkan Web PWA statis dan API Backend (127.0.0.1:3100) dalam SATU domain.
# 100% kompatibel dengan Cloudflare Universal SSL (tanpa sub-subdomain).

# 1. API & Backend endpoints diteruskan ke proses Node.js pm2 di 127.0.0.1:3100
location ~ ^/(auth|sesi|permintaan|grup|kategori|gtk|pengetahuan|seri|simgtk|admin|health) {
  proxy_pass http://127.0.0.1:3100;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_cache_bypass $http_upgrade;

  # Batas waktu dan ukuran chunk upload audio
  client_max_body_size 10M;
  proxy_read_timeout 300s;
  proxy_connect_timeout 60s;
}

# 2. Aset ber-hash Vite aman di-cache jangka panjang
location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

# 3. PWA Service Worker & Manifest tidak boleh di-cache agresif agar pembaruan app instan
location = /sw.js {
  add_header Cache-Control "no-cache";
  try_files $uri =404;
}
location = /manifest.webmanifest {
  add_header Cache-Control "no-cache";
  try_files $uri =404;
}
location = /index.html {
  add_header Cache-Control "no-cache";
}

# 4. Halaman Frontend SPA (TanStack Router fallback ke index.html)
location / {
  try_files $uri $uri/ /index.html;
}
