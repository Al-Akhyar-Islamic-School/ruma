# Tempel di CloudPanel: situs Static (web) > Vhost, ganti blok `location /` yang ada dengan blok di bawah.
# Aplikasi web adalah SPA (TanStack Router): rute seperti /sesi/<uuid> harus jatuh ke index.html.

location / {
  try_files $uri $uri/ /index.html;
}

# Service worker dan manifest PWA tidak boleh di-cache lama, atau pembaruan aplikasi tertahan di perangkat.
location = /sw.js {
  add_header Cache-Control "no-cache";
  try_files $uri =404;
}
location = /manifest.webmanifest {
  add_header Cache-Control "no-cache";
  try_files $uri =404;
}
location = /index.html {
  add_header Cache-Control "no-cache";
}

# Berkas ber-hash Vite aman di-cache selamanya.
location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}
