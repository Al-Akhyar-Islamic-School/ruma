[package]
name = "ruma-desktop"
version = "0.1.0"
description = "ruma. Desktop - Asisten Notulensi & Perekaman Rapat Al Akhyar"
authors = ["Sekolah Islam Al Akhyar"]
edition = "2021"

[lib]
name = "ruma_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-shell = "2.2"
tauri-plugin-fs = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
hound = "3.5"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
base64 = "0.22"
rfd = "0.15"
