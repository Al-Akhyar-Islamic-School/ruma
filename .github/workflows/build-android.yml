name: Build & Release Android APK

on:
  push:
    tags:
      - 'release-android-*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (mis. 1.0.0 — kosongkan untuk ambil dari tag)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tentukan Versi Aplikasi
        id: version
        run: |
          VERSION="${{ inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RAW_TAG="${{ github.ref_name }}"
              VERSION=$(echo "$RAW_TAG" | sed -E 's/^release-android-//' | sed -E 's/^v//')
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versi APK: $VERSION"

      - name: Build Web App & Sync Capacitor Android
        env:
          VITE_NATIVE: "1"
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ruma.alakhyar.sch.id' }}
        run: |
          pnpm --filter @kalam/web build
          pnpm --filter @kalam/web exec cap sync android

      - name: Build APK via Gradle
        run: |
          cd apps/web/android
          ./gradlew assembleDebug

      - name: Siapkan Berkas APK
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK_NAME="ruma-v${VERSION}-debug.apk"
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_NAME"

      - name: Unggah Artefak APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Terbitkan ke GitHub Releases (Saat Push Tag)
        if: startsWith(github.ref, 'refs/tags/release-android-')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          name: "Aplikasi Android ruma. v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
