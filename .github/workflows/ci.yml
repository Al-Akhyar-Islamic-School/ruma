name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifikasi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm dari "packageManager" di package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      # schema.ts yang berubah tanpa migrasi baru = deploy yang melempar "Unknown column" di produksi.
      - name: Migrasi sinkron dengan schema.ts
        run: |
          pnpm --filter @kalam/api exec drizzle-kit generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::schema.ts berubah tetapi migrasinya belum dibuat. Jalankan 'pnpm --filter @kalam/api db:generate' dan commit hasilnya."
            git status --porcelain apps/api/drizzle
            exit 1
          fi

      - name: Build API
        run: pnpm --filter @kalam/api build

      - name: Build web
        run: pnpm --filter @kalam/web build
        env:
          VITE_API_URL: https://api.example.test
